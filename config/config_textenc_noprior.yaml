model:
  pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"

dataset:
  instance_data_dir: "/data/roycecho/dreambooth/data/data_dog/instance_images" 
  class_data_dir: "./data/data_dog/class_images"       
  instance_prompt: "a photo of a sks dog"     
  class_prompt: "a photo of a dog"            
  resolution: 512
  center_crop: false

training:
  seed: 1337
  train_batch_size: 1
  max_train_steps: 1000
  checkpointing_steps: 500       
  gradient_accumulation_steps: 1 # 배치 사이즈를 늘리는 효과 (VRAM이 적을 때 유용)
  learning_rate: 1e-6            # Text Encoder 학습 시에는 보통 1e-6 같은 낮은 학습률이 권장됩니다.
  lr_scheduler: "constant"       # "constant", "linear", "cosine", "cosine_with_restarts", "constant_with_warmup"
  lr_warmup_steps: 0
  use_8bit_adam: true            # 메모리 절약을 위해 8bit Adam(Optimizer) 사용 권장
  mixed_precision: "fp16"        # "no", "fp16", "bf16"
  gradient_checkpointing: true   
  train_text_encoder: true       # Text Encoder 학습

prior_preservation:
  enabled: false                 # Prior Preservation(Class Data) 학습 안 함
  prior_loss_weight: 1.0         
  num_class_images: 200
